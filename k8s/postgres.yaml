apiVersion: v1
kind: PersistentVolume
metadata:
  name: oms2-postgres-data-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: oms2-local
  hostPath:
    path: /mnt/oms-data/oms2-postgres-data
    type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms2-postgres
  namespace: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oms2-postgres
  template:
    metadata:
      labels:
        app: oms2-postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: oms2
            - name: POSTGRES_USER
              value: oms2
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oms2-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oms2-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oms2-postgres-data
  namespace: oms
spec:
  volumeName: oms2-postgres-data-pv
  storageClassName: oms2-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oms2-postgres
  namespace: oms
spec:
  selector:
    app: oms2-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
